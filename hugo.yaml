baseURL: "https://tuanhiep.github.io/"
title: "Tuan Hiep TRAN — Technocrat Press"
languageCode: "en-us"
theme: "PaperMod"
googleAnalytics: "G-P0Y0LZDWZS"

taxonomies:
  category: categories
  tag: tags
  series: series

pagination:
  pagerSize: 40
enableRobotsTXT: true
enableGitInfo: true

frontmatter:
  date:
    - date
    - publishDate
    - :git
  lastmod:
    - lastmod
    - date
    - publishDate
    - :git

params:
  env: production
  defaultTheme: auto
  mainSections:
    - posts
  showReadingTime: true
  showToc: true
  tocOpen: true
  author: "Tuan Hiep TRAN"
  socialIcons:
    - name: linkedin
      title: LinkedIn
      url: "https://www.linkedin.com/in/tuan-hiep-tran/"
    - name: github
      title: GitHub
      url: "https://github.com/tuanhiep"
    - name: rss
      title: RSS
      url: "/posts/index.xml"
  homeInfoParams:
    Title: "Tuan Hiep TRAN — System Design, Production Engineering & Sovereign Governance"
    Content: >
      Engineering blueprints, runtime failure autopsies, and GEM DBA doctoral research on technology governance and digital sovereignty.
  showLastMod: true
  footer:
    text: 'Technocrat Press · [About](/about/) / [Sovera](/sovera/) / [Books](/books/) / [Tags](/tags/) / [LinkedIn](https://www.linkedin.com/in/tuan-hiep-tran/) / [GitHub](https://github.com/tuanhiep) / [RSS](/posts/index.xml)'
  analytics:
    google:
      SiteVerificationTag: "p0E9Md4M8vdZsufpDXcbZrV0pgtWlIEvy9vy0XYvl0w"
  mermaid:
    enable: true
    theme: "default"

menu:
  main:
    - identifier: nav-about
      name: About
      url: /about/
      weight: 1
    - identifier: track-system-design
      name: System Design
      url: /posts/system-design/
      weight: 2
    - identifier: track-principal-craft
      name: Production Engineering
      url: /posts/principal-craft/
      weight: 3
    - identifier: track-sovereignty-gov
      name: Sovereign Governance
      url: /posts/sovereignty-gov/
      weight: 4
    - identifier: nav-series
      name: Series
      url: /series/
      weight: 5
    - identifier: nav-sovera
      name: Sovera
      url: /sovera/
      weight: 6
    - identifier: nav-books
      name: Books
      url: /books/
      weight: 7

markup:
  highlight:
    noClasses: false
    lineNos: false
    lineNumbersInTable: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    hl_Lines: ""
    hl_inline: false
    style: "monokai"
    tabWidth: 4
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - $$
              - $$
            - - \[
              - \]
          inline:
            - - $
              - $
            - - \(
              - \)
