<script>
(function () {
    try { localStorage.removeItem("tp_lang"); } catch (e) {}
    var urlLang = new URLSearchParams(window.location.search).get("lang");
    var saved = "en";
    try { saved = urlLang || sessionStorage.getItem("tp_session_lang") || "en"; } catch (e) { saved = urlLang || "en"; }
    if (saved !== "en" && saved !== "fr" && saved !== "vi") { saved = "en"; }
    document.documentElement.setAttribute("data-ui-lang", saved);
})();
</script>

    /* Top Header Language Switcher (EN / FR / VI) */
    .lang-switch-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.12rem;
        padding: 0.14rem 0.35rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--entry);
        font-size: 0.72rem;
        line-height: 1;
    }

    .lang-switch-pill .lang-sep {
        color: var(--tertiary);
        font-size: 0.7rem;
    }

    .lang-btn {
        appearance: none;
        background: transparent;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-block-size: 24px;
        min-inline-size: 26px;
        padding: 0.18rem 0.42rem;
        border-radius: 999px;
        color: var(--secondary);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-decoration: none;
        box-shadow: none !important;
        transition: all 0.14s ease;
    }

    .lang-btn:hover {
        color: var(--primary);
    }

    .lang-btn:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    .lang-btn.active {
        background: var(--primary);
        color: var(--theme);
    }

    .lang-panel[hidden] {
        display: none;
    }

    html[data-ui-lang="fr"]:has([data-lang-panel="fr"]) [data-lang-panel]:not([data-lang-panel="fr"]),
    html[data-ui-lang="vi"]:has([data-lang-panel="vi"]) [data-lang-panel]:not([data-lang-panel="vi"]),
    html[data-ui-lang="en"] [data-lang-panel]:not([data-lang-panel="en"]),
    html:not([data-ui-lang]) [data-lang-panel]:not([data-lang-panel="en"]) {
        display: none;
    }

    html[data-ui-lang="fr"]:has([data-lang-panel="fr"]) [data-lang-panel="fr"][hidden],
    html[data-ui-lang="vi"]:has([data-lang-panel="vi"]) [data-lang-panel="vi"][hidden] {
        display: block;
    }

        flex-wrap: wrap;

<script>
document.addEventListener("DOMContentLoaded", function () {
    const shell = document.querySelector(".va-shell");
    const audio = document.getElementById("va-audio");
    const syncNode = document.getElementById("va-sync-data");
    if (!shell || !audio) return;

    let timings = {};
    if (syncNode) {
        try {
            timings = JSON.parse(syncNode.textContent || "{}");
        } catch (e) {}
    }

    const voiceBtns = Array.from(shell.querySelectorAll("[data-va-voice]"));
    const rateBtns = Array.from(shell.querySelectorAll("[data-va-rate]"));
    const followBtn = shell.querySelector("[data-va-follow]");
    const chainBtn = shell.querySelector("[data-va-chain]");
    const cueNodes = Array.from(shell.querySelectorAll("[data-va-cue]"));
    const toolbar = shell.querySelector(".va-toolbar");

    if (toolbar && cueNodes.length && !toolbar.querySelector("[data-va-loop]")) {
        const drillGroup = document.createElement("div");
        drillGroup.className = "va-group va-drill-group";
        drillGroup.setAttribute("role", "group");
        drillGroup.setAttribute("aria-label", "Study loop and active recall drills");
        drillGroup.innerHTML =
            '<button type="button" class="va-btn" data-va-loop aria-pressed="false" title="Repeat the active sentence continuously">🔁 Loop Line</button>' +
            '<button type="button" class="va-btn" data-va-hide="en" aria-pressed="false" title="Blur English text to test recall (tap blurred line to reveal)">👁️ Hide EN</button>' +
            '<button type="button" class="va-btn" data-va-hide="vi" aria-pressed="false" title="Blur Vietnamese text to test recall (tap blurred line to reveal)">👁️ Hide VI</button>' +
            '<button type="button" class="va-btn" data-va-bedtime aria-pressed="false" title="Warm amber night reading mode + 15-minute gentle sleep timer">🌙 Bedtime 15m</button>';
        toolbar.appendChild(drillGroup);
    }

    const loopBtn = shell.querySelector("[data-va-loop]");
    const hideBtns = Array.from(shell.querySelectorAll("[data-va-hide]"));
    const bedtimeBtn = shell.querySelector("[data-va-bedtime]");
    let bedtimeTimerId = null;
    let bedtimeRemaining = 0;

    function stopBedtime() {
        if (bedtimeTimerId) {
            clearInterval(bedtimeTimerId);
            bedtimeTimerId = null;
        }
        bedtimeRemaining = 0;
        document.body.classList.remove("va-bedtime");
        audio.volume = 1.0;
        if (bedtimeBtn) {
            bedtimeBtn.classList.remove("is-active");
            bedtimeBtn.setAttribute("aria-pressed", "false");
            bedtimeBtn.textContent = "🌙 Bedtime 15m";
        }
    }

    if (bedtimeBtn) {
        bedtimeBtn.addEventListener("click", function () {
            if (bedtimeTimerId) {
                stopBedtime();
                return;
            }
            bedtimeRemaining = 900;
            document.body.classList.add("va-bedtime");
            bedtimeBtn.classList.add("is-active");
            bedtimeBtn.setAttribute("aria-pressed", "true");
            audio.volume = 1.0;
            if (audio.paused) {
                const p = audio.play();
                if (p && typeof p.catch === "function") p.catch(function () {});
            }
            const fmt = function (s) {
                const m = Math.floor(s / 60);
                const r = s % 60;
                return "🌙 " + String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");
            };
            bedtimeBtn.textContent = fmt(bedtimeRemaining);
            bedtimeTimerId = setInterval(function () {
                bedtimeRemaining -= 1;
                if (bedtimeRemaining <= 12 && bedtimeRemaining > 0) {
                    audio.volume = Math.max(0.05, bedtimeRemaining / 12);
                }
                if (bedtimeRemaining <= 0) {
                    audio.pause();
                    stopBedtime();
                    return;
                }
                bedtimeBtn.textContent = fmt(bedtimeRemaining);
            }, 1000);
        });
    }

    let activeVoice = (voiceBtns[0] && voiceBtns[0].getAttribute("data-va-voice")) || "female";
    let activeRate = 1.0;
    let autoFollow = true;
    let autoChain = Boolean(chainBtn && chainBtn.getAttribute("aria-pressed") === "true");
    let loopLine = false;
    let loopCueId = null;
    let loopVoice = activeVoice;
    let currentCue = null;

    const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function getCueRanges(voiceKey) {
        return timings[voiceKey || activeVoice] || {};
    }

    function setActiveCue(cueId) {
        if (currentCue === cueId) return;
        currentCue = cueId;
        cueNodes.forEach(function (el) {
            const match = cueId !== null && el.getAttribute("data-va-cue") === cueId;
            el.classList.toggle("is-active", match);
            if (el.hasAttribute("aria-pressed")) {
                el.setAttribute("aria-pressed", match ? "true" : "false");
            }
            if (match && autoFollow) {
                el.scrollIntoView({
                    block: "nearest",
                    behavior: prefersReduced ? "auto" : "smooth"
                });
            }
        });
    }

    function findCueAtTime(t) {
        const ranges = getCueRanges();
        let hit = null;
        Object.keys(ranges).forEach(function (id) {
            const pair = ranges[id];
            if (pair && pair.length === 2 && t >= pair[0] && t <= pair[1] + 0.14) {
                hit = id;
            }
        });
        return hit;
    }

    function seekToTime(t, autoPlay) {
        const apply = function () {
            try {
                audio.currentTime = Math.max(0, t);
            } catch (e) {}
            audio.playbackRate = activeRate;
            if (autoPlay) {
                const p = audio.play();
                if (p && typeof p.catch === "function") p.catch(function () {});
            }
        };
        if (audio.readyState >= 1) {
            apply();
        } else {
            audio.addEventListener("loadedmetadata", apply, { once: true });
            audio.load();
        }
    }

    function switchVoice(nextVoice, targetTime, autoPlay) {
        const btn = voiceBtns.find(function (b) {
            return b.getAttribute("data-va-voice") === nextVoice;
        });
        if (!btn) return false;
        const nextSrc = btn.getAttribute("data-src");
        if (!nextSrc) return false;

        activeVoice = nextVoice;
        if (loopLine) {
            const nextRanges = getCueRanges(nextVoice);
            if (loopCueId && nextRanges[loopCueId]) {
                loopVoice = nextVoice;
            } else {
                loopCueId = null;
                loopVoice = nextVoice;
            }
        }
        voiceBtns.forEach(function (b) {
            const on = b === btn;
            b.classList.toggle("is-active", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
        });

        audio.src = nextSrc;
        audio.load();
        audio.addEventListener("loadedmetadata", function () {
            seekToTime(targetTime, autoPlay);
        }, { once: true });
        return true;
    }

    voiceBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
            const nextVoice = btn.getAttribute("data-va-voice");
            const nextSrc = btn.getAttribute("data-src");
            if (!nextVoice || !nextSrc || nextVoice === activeVoice) return;

            const wasPlaying = !audio.paused && !audio.ended;
            const prevTime = audio.currentTime || 0;
            const prevDuration = audio.duration || 0;
            const cueToRestore = currentCue || findCueAtTime(prevTime);

            const nextRanges = getCueRanges(nextVoice);
            let targetTime = 0;
            if (cueToRestore && nextRanges[cueToRestore]) {
                targetTime = nextRanges[cueToRestore][0];
            } else if (prevDuration > 0 && audio.src && (activeVoice === "female" || activeVoice === "male") && (nextVoice === "female" || nextVoice === "male")) {
                targetTime = prevTime;
            }
            switchVoice(nextVoice, targetTime, wasPlaying);
        });
    });

    rateBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
            const r = parseFloat(btn.getAttribute("data-va-rate") || "1");
            activeRate = Number.isFinite(r) ? r : 1.0;
            audio.playbackRate = activeRate;
            rateBtns.forEach(function (b) {
                const on = b === btn;
                b.classList.toggle("is-active", on);
                b.setAttribute("aria-pressed", on ? "true" : "false");
            });
        });
    });

    if (followBtn) {
        followBtn.addEventListener("click", function () {
            autoFollow = !autoFollow;
            followBtn.classList.toggle("is-active", autoFollow);
            followBtn.setAttribute("aria-pressed", autoFollow ? "true" : "false");
        });
    }

    if (chainBtn) {
        chainBtn.addEventListener("click", function () {
            autoChain = !autoChain;
            chainBtn.classList.toggle("is-active", autoChain);
            chainBtn.setAttribute("aria-pressed", autoChain ? "true" : "false");
        });
    }

    if (loopBtn) {
        loopBtn.addEventListener("click", function () {
            loopLine = !loopLine;
            loopBtn.classList.toggle("is-active", loopLine);
            loopBtn.setAttribute("aria-pressed", loopLine ? "true" : "false");
            if (loopLine) {
                const ranges = getCueRanges();
                const fallbackId = cueNodes[0] ? cueNodes[0].getAttribute("data-va-cue") : null;
                loopCueId = currentCue || findCueAtTime(audio.currentTime) || (fallbackId && ranges[fallbackId] ? fallbackId : Object.keys(ranges)[0] || null);
                loopVoice = activeVoice;
                if (loopCueId && ranges[loopCueId]) {
                    setActiveCue(loopCueId);
                    if (audio.paused || audio.ended) {
                        seekToTime(ranges[loopCueId][0], true);
                    }
                }
            }
        });
    }

    hideBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
            const langKey = btn.getAttribute("data-va-hide");
            if (!langKey) return;
            const cls = "va-hide-" + langKey;
            const nextOn = !shell.classList.contains(cls);
            shell.classList.toggle(cls, nextOn);
            btn.classList.toggle("is-active", nextOn);
            btn.setAttribute("aria-pressed", nextOn ? "true" : "false");
            shell.querySelectorAll(".is-revealed[data-va-track=\"" + langKey + "\"], .va-row.is-revealed, .va-vocab-card.is-revealed").forEach(function (node) {
                node.classList.remove("is-revealed");
            });
        });
    });

    function revealMaskedElement(el) {
        if (!el) return;
        const track = el.getAttribute("data-va-track");
        if (track && shell.classList.contains("va-hide-" + track)) {
            el.classList.add("is-revealed");
        } else if ((el.classList.contains("va-row") || el.classList.contains("va-vocab-card")) && (shell.classList.contains("va-hide-en") || shell.classList.contains("va-hide-vi"))) {
            el.classList.add("is-revealed");
        }
    }

    function activateCueNode(el) {
        const id = el.getAttribute("data-va-cue");
        const trackVoice = el.getAttribute("data-va-track");
        if (!id) return;
        revealMaskedElement(el);
        if (trackVoice && trackVoice !== activeVoice) {
            const targetRanges = getCueRanges(trackVoice);
            if (targetRanges[id]) {
                loopCueId = id;
                loopVoice = trackVoice;
                setActiveCue(id);
                switchVoice(trackVoice, targetRanges[id][0], true);
                return;
            }
        }
        const ranges = getCueRanges();
        if (ranges[id]) {
            loopCueId = id;
            loopVoice = activeVoice;
            setActiveCue(id);
            seekToTime(ranges[id][0], true);
        }
    }

    cueNodes.forEach(function (el) {
        el.addEventListener("click", function () {
            activateCueNode(el);
        });
        el.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") {
                ev.preventDefault();
                activateCueNode(el);
            }
        });
    });

    audio.addEventListener("timeupdate", function () {
        if (loopLine && loopCueId && loopVoice === activeVoice && !audio.paused) {
            const pair = getCueRanges()[loopCueId];
            if (pair && pair.length === 2 && audio.currentTime >= pair[1] - 0.04 && audio.currentTime <= pair[1] + 0.65) {
                audio.currentTime = Math.max(0, pair[0]);
                return;
            }
        }
        setActiveCue(findCueAtTime(audio.currentTime));
    });

    audio.addEventListener("ratechange", function () {
        activeRate = audio.playbackRate;
    });

    audio.addEventListener("ended", function () {
        if (loopLine && loopCueId && loopVoice === activeVoice) {
            const pair = getCueRanges()[loopCueId];
            if (pair && pair.length === 2) {
                seekToTime(pair[0], true);
                return;
            }
        }
        if (autoChain && activeVoice === "en") {
            const hasVi = voiceBtns.some(function (b) {
                return b.getAttribute("data-va-voice") === "vi";
            });
            if (hasVi) {
                setActiveCue(null);
                switchVoice("vi", 0, true);
                return;
            }
        }
        setActiveCue(null);
    });
});
</script>

        ctx.fillStyle = "#9e2a2b";

        ctx.font = "20px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText("tuanhiep.github.io/books/", W / 2, 1048);
    }

    drawCertificate();
    nameInput.addEventListener("input", drawCertificate);
    bookSelect.addEventListener("change", drawCertificate);
    dateInput.addEventListener("input", drawCertificate);

<script>
document.addEventListener("DOMContentLoaded", function () {
    // 1. Interactive Track Filter
    const buttons = document.querySelectorAll(".home-filter-bar .filter-btn");
    const entries = document.querySelectorAll(".post-entry[data-track]");
    const emptyState = document.getElementById("filter-empty-state");

    if (buttons.length && entries.length) {
        function applyFilter(track) {
            let visibleCount = 0;
            entries.forEach(function (entry) {
                const matches = track === "all" || entry.getAttribute("data-track") === track;
                entry.style.display = matches ? "" : "none";
                if (matches) visibleCount++;
            });
            buttons.forEach(function (btn) {
                btn.classList.toggle("active", btn.getAttribute("data-filter") === track);
            });
            if (emptyState) {
                emptyState.hidden = visibleCount > 0;
            }
        }

        buttons.forEach(function (btn) {
            btn.addEventListener("click", function () {
                const track = btn.getAttribute("data-filter");
                applyFilter(track);
                const url = new URL(window.location);
                if (track === "all") {
                    url.searchParams.delete("track");
                } else {
                    url.searchParams.set("track", track);
                }
                window.history.replaceState({}, "", url);
            });
        });

        const initialTrack = new URLSearchParams(window.location.search).get("track");
        if (initialTrack && ["all", "sd", "arch", "sov"].includes(initialTrack)) {
            applyFilter(initialTrack);
        }
    }

    // 2. Trilingual EN / FR / VI Switcher (Top Header Pill)
    const langButtons = document.querySelectorAll(".lang-switch-pill .lang-btn[data-lang-switch]");
    const langLinks = document.querySelectorAll(".lang-switch-pill .lang-btn[data-lang-link]");
    const langPanels = document.querySelectorAll("[data-lang-panel]");
    const i18nNodes = document.querySelectorAll("[data-i18n-en]");
    const supportedLangs = ["en", "fr", "vi"];

    langLinks.forEach(function (lnk) {
        lnk.addEventListener("click", function () {
            const targetLang = lnk.getAttribute("data-lang-link");
            if (targetLang && supportedLangs.includes(targetLang)) {
                try {
                    sessionStorage.setItem("tp_session_lang", targetLang);
                } catch (e) {}
            }
        });
    });

    function hasLanguageOnPage(lang) {
        if (lang === "en") return true;
        if (langPanels.length > 0) {
            return Array.from(langPanels).some(function (p) {
                return p.getAttribute("data-lang-panel") === lang;
            });
        }
        return Array.from(i18nNodes).some(function (n) {
            return Boolean(n.getAttribute("data-i18n-" + lang));
        });
    }

    function applyLanguage(lang, persistChoice) {
        const requested = supportedLangs.includes(lang) ? lang : "en";
        const effective = hasLanguageOnPage(requested) ? requested : "en";

        langButtons.forEach(function (btn) {
            const isSelected = btn.getAttribute("data-lang-switch") === effective;
            btn.classList.toggle("active", isSelected);
            btn.setAttribute("aria-pressed", isSelected ? "true" : "false");
        });

        langPanels.forEach(function (panel) {
            const match = panel.getAttribute("data-lang-panel") === effective;
            panel.hidden = !match;
        });

        i18nNodes.forEach(function (node) {
            const val = node.getAttribute("data-i18n-" + effective) || node.getAttribute("data-i18n-en");
            if (val) node.textContent = val;
        });

        document.documentElement.setAttribute("data-ui-lang", effective);
        if (persistChoice !== false) {
            try {
                sessionStorage.setItem("tp_session_lang", requested);
            } catch (e) {}
        }
    }

    langButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
            applyLanguage(btn.getAttribute("data-lang-switch"), true);
        });
    });

    if (langButtons.length > 0 || langPanels.length > 0 || i18nNodes.length > 0) {
        const urlLang = new URLSearchParams(window.location.search).get("lang");
        let savedLang = "en";
        try {
            savedLang = urlLang || sessionStorage.getItem("tp_session_lang") || "en";
        } catch (e) {
            savedLang = urlLang || "en";
        }
        applyLanguage(savedLang, Boolean(urlLang));
    }

    // 3. Bookshelf Category Filter (Vietnamese Waves EN / FR / Technocrat Press)
    document.querySelectorAll("[data-shelf-scope]").forEach(function (scope) {
        const tabs = scope.querySelectorAll(".vw-shelf-tab[data-shelf-filter]");
        const shelves = scope.querySelectorAll("[data-shelf-group]");
        if (!tabs.length || !shelves.length) return;

        function applyShelf(filterVal) {
            shelves.forEach(function (sec) {
                const grp = sec.getAttribute("data-shelf-group");
                sec.hidden = !(filterVal === "all" || grp === filterVal);
            });
            tabs.forEach(function (t) {
                const active = t.getAttribute("data-shelf-filter") === filterVal;
                t.classList.toggle("is-active", active);
                t.setAttribute("aria-pressed", active ? "true" : "false");
            });
        }

        tabs.forEach(function (tab) {
            tab.addEventListener("click", function () {
                applyShelf(tab.getAttribute("data-shelf-filter") || "all");
            });
        });
    });
});
</script>
