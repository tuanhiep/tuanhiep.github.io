<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,500..700;1,6..72,400..600&display=swap">

<script>
(function () {
    try { localStorage.removeItem("tp_lang"); } catch (e) {}
    var urlLang = new URLSearchParams(window.location.search).get("lang");
    var saved = "en";
    try { saved = urlLang || sessionStorage.getItem("tp_session_lang") || "en"; } catch (e) { saved = urlLang || "en"; }
    if (saved !== "en" && saved !== "fr" && saved !== "vi") { saved = "en"; }
    document.documentElement.setAttribute("data-ui-lang", saved);
})();
</script>

{{ if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError : false
    });"></script>
{{ end }}

{{ if or .Params.mermaid .Site.Params.mermaid.enable }}
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
</script>
{{ end }}

<style>
    :root {
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
        font-family: var(--font-sans);
        font-size-adjust: from-font;
        line-height: 1.65;
    }

    h1,
    h2,
    h3,
    .post-title,
    .page-header h1,
    .entry-header h2,
    .home-hero-head h1,
    .about-hero h1,
    .about-section h2,
    .books-section h2,
    .home-stream-title h2,
    .about-grid h3,
    .about-grid-2 h3,
    .book-details h3,
    .post-content h1,
    .post-content h2,
    .post-content h3 {

    .home-hero-head h1 {

        line-height: 1.15;
    }

    .post-title,
    .page-header h1 {
        font-size: clamp(1.85rem, 1.35rem + 1.6vw, 2.6rem);
        line-height: 1.15;
    }

    .header-nav .logo a,
    .menu a,
    .about-kicker,
    .home-eyebrow,
    .book-badge,
    .books-strip-tag,
    .track-pill,
    .series-pill,
    .filter-btn,
    .connect-pill,
    .about-actions a,
    .books-strip-cta,
    .atlas-count {
        font-family: var(--font-sans);
    }

    .post-content p,
    .about-lede,
    .about-sublede,
    .books-intro,
    .post-content blockquote {
        text-wrap: pretty;
        overflow-wrap: break-word;
    }

    .post-content blockquote {
        font-family: var(--font-serif);
        font-size: 1.08rem;
        line-height: 1.65;
        font-size-adjust: from-font;
    }

    .post-content th {
        text-wrap: balance;
    }

    code,
    pre,
    kbd,
    samp {
        font-family: var(--font-mono);
        font-size-adjust: from-font;
    }

    @supports not (font-size-adjust: from-font) {
        body {
            line-height: 1.65;
        }
        .post-content code {
            font-size: 0.84em;
        }
    }

    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4 {
        margin-top: 1em !important;    /* Đẩy tiêu đề cách xa đoạn văn phía trên */
        margin-bottom: 1em !important; /* Tạo khoảng thở với đoạn văn phía dưới */
    }

    .post-cta {
        margin-top: 3rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
        color: var(--secondary);
        font-size: 0.95rem;
    }

    .post-cta p {
        margin: 0.35rem 0;
    }

    .post-cta a {
        color: var(--primary);
        box-shadow: 0 1px 0 var(--tertiary);
    }

    .post-cta a:hover {
        box-shadow: 0 1px 0 var(--primary);
    }

    .about-page {
        max-width: 960px;
    }

    .about-page .post-content {
        font-size: 1rem;
        line-height: 1.75;
    }

    .about-hero {
        padding: 4.5rem 0 2.25rem;
        border-bottom: 1px solid var(--border);
    }

    .about-kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 0.75rem;
        color: var(--secondary);
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
    }

    .about-kicker span {
        font-size: 1.25rem;
        letter-spacing: 0;
    }

    .about-hero h1 {
        margin: 0;
        font-size: clamp(2.25rem, 1.55rem + 2.2vw, 3.1rem);
        line-height: 1.08;
    }

    .about-lede {
        max-width: 68ch;
        margin: 1.15rem 0 0;
        color: var(--primary);
        font-size: 1.18rem;
        font-weight: 500;
        line-height: 1.55;
    }

    .about-sublede {
        max-width: 68ch;
        margin: 0.9rem 0 0;
        color: var(--content);
        font-size: 1rem;
        line-height: 1.7;
    }

    .about-section {
        margin-top: 2.5rem;
    }

    .about-section h2 {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 1rem !important;
        font-size: 1.45rem;
    }

    .about-inst {
        margin: 0 0 0.55rem !important;
        font-size: 0.94rem !important;
        font-weight: 500;
        color: var(--content) !important;
        line-height: 1.5;
    }

    .about-grid h3 a {
        color: var(--primary);
        box-shadow: none;
    }

    .about-grid h3 a:hover {
        text-decoration: underline;
    }

    .about-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.75rem;
    }

    .about-actions a,
    .about-principles span {
        display: inline-flex;
        align-items: center;
        min-height: 2.35rem;
        padding: 0.35rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--entry);
        color: var(--primary);
        box-shadow: none;
        font-size: 0.95rem;
        font-weight: 600;
    }

    .about-actions a:hover {
        border-color: var(--secondary);
    }

    .about-crosslink {
        margin: 1.5rem 0 2rem;
        padding: 1rem 1.15rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--entry);
    }

    .about-crosslink p {
        margin: 0;
        color: var(--secondary);
        font-size: 0.98rem;
    }

    .about-crosslink strong {
        color: var(--primary);
    }

    .about-crosslink a {
        color: var(--primary);
        box-shadow: 0 1px 0 var(--tertiary);
    }

    .about-crosslink a:hover {
        box-shadow: 0 1px 0 var(--primary);
    }

    .about-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        margin: 2rem 0;
    }

    .about-grid article {
        padding: 1.15rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--entry);
    }

    .about-grid h2,
    .about-body h2 {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 0.6rem !important;
        font-size: 1.05rem;
        line-height: 1.3;
    }

    .about-grid h2 span {
        flex: none;
        font-size: 1.05rem;
        line-height: 1;
    }

    .about-grid p,
    .about-body p {
        margin: 0;
        color: var(--secondary);
        font-size: 0.95rem;
        line-height: 1.65;
    }

    .about-body {
        max-width: 760px;
        margin-top: 2.25rem;
    }

    .about-body p + p {
        margin-top: 1rem;
    }

    .about-principles {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
    }

    .about-grid h2 a {
        color: var(--primary);
        box-shadow: none;
    }

    .about-grid h2 a:hover {
        box-shadow: 0 1px 0 var(--primary);
    }

    .books-section {
        margin-top: 2.5rem;
    }

    .books-section h2 {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 0.75rem !important;
        font-size: 1.35rem;
    }

    .books-intro {
        max-width: 820px;
        color: var(--secondary);
        font-size: 0.98rem;
        margin-bottom: 1.5rem;
    }

    .book-badge {
        display: inline-block;
        padding: 0.18rem 0.6rem;
        margin-bottom: 0.55rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: var(--secondary);
        background: var(--theme);
    }

    .book-badge-live {
        color: var(--primary);
        border-color: var(--primary);
    }

    .book-badge-upcoming {
        color: var(--primary);
    }

    .about-grid h3,
    .about-grid-2 h3,
    .book-details h3 {
        margin: 0.15rem 0 0.5rem !important;
        font-size: 1.24rem;
        line-height: 1.26;
    }

    .about-grid p + p,
    .about-grid-2 p + p {
        margin-top: 0.6rem;
    }

    .book-inline-links {
        margin-top: 0.75rem !important;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .books-featured-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem;
        margin: 1.5rem 0 2rem;
    }

    .book-card {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 1.15rem;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--entry);
        align-items: start;
    }

    .book-cover {
        width: 100%;
        height: auto;
        border-radius: 6px;
        border: 1px solid var(--border);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        display: block;
    }

    .book-subtitle {
        margin: 0 0 0.4rem !important;
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--primary);
    }

    .book-specs {
        margin: 0 0 0.6rem !important;
        font-size: 0.85rem;
        color: var(--secondary);
    }

    .book-desc {
        margin: 0 0 0.85rem !important;
        font-size: 0.92rem;
        color: var(--content);
        line-height: 1.55;
    }

    .book-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
    }

    .book-links a {
        display: inline-flex;
        align-items: center;
        padding: 0.3rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--theme);
        color: var(--primary);
        box-shadow: none;
        font-size: 0.85rem;
        font-weight: 600;
    }

    .book-links a:hover {
        border-color: var(--primary);
    }

    :root {
        --nav-width: 1280px;
        --main-width: 1020px;
        --track-sd-color: #1d4ed8;
        --track-sd-bg: rgba(37, 99, 235, 0.08);
        --track-sd-border: rgba(37, 99, 235, 0.30);
        --track-arch-color: #0f766e;
        --track-arch-bg: rgba(13, 148, 136, 0.08);
        --track-arch-border: rgba(13, 148, 136, 0.30);
        --track-sov-color: #6d28d9;
        --track-sov-bg: rgba(124, 58, 237, 0.08);
        --track-sov-border: rgba(124, 58, 237, 0.30);
    }

    :root[data-theme="dark"] {
        --track-sd-color: #60a5fa;
        --track-sd-bg: rgba(96, 165, 250, 0.14);
        --track-sd-border: rgba(96, 165, 250, 0.36);
        --track-arch-color: #2dd4bf;
        --track-arch-bg: rgba(45, 212, 191, 0.14);
        --track-arch-border: rgba(45, 212, 191, 0.36);
        --track-sov-color: #c4b5fd;
        --track-sov-bg: rgba(167, 139, 250, 0.14);
        --track-sov-border: rgba(167, 139, 250, 0.36);
    }

    .post-single:not(.about-page) {
        max-width: 820px;
        margin: 0 auto;
    }

    .header-nav .logo a {
        font-size: 18px;
        white-space: nowrap;
    }

    .header-nav .menu {
        column-gap: 14px;
    }

    .header-nav .menu a {
        font-size: 14px;
    }

    /* Top Header Language Switcher (EN / FR / VI) */
    .lang-switch-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.12rem;
        padding: 0.14rem 0.35rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--entry);
        font-size: 0.72rem;
        line-height: 1;
    }

    .lang-switch-pill .lang-sep {
        color: var(--tertiary);
        font-size: 0.7rem;
    }

    .lang-btn {
        appearance: none;
        background: transparent;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-block-size: 24px;
        min-inline-size: 26px;
        padding: 0.18rem 0.42rem;
        border-radius: 999px;
        color: var(--secondary);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        transition: all 0.14s ease;
    }

    .lang-btn:hover {
        color: var(--primary);
    }

    .lang-btn:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    .lang-btn.active {
        background: var(--primary);
        color: var(--theme);
    }

    .lang-panel[hidden] {
        display: none;
    }

    html[data-ui-lang="fr"]:has([data-lang-panel="fr"]) [data-lang-panel]:not([data-lang-panel="fr"]),
    html[data-ui-lang="vi"]:has([data-lang-panel="vi"]) [data-lang-panel]:not([data-lang-panel="vi"]),
    html[data-ui-lang="en"] [data-lang-panel]:not([data-lang-panel="en"]),
    html:not([data-ui-lang]) [data-lang-panel]:not([data-lang-panel="en"]) {
        display: none;
    }

    html[data-ui-lang="fr"]:has([data-lang-panel="fr"]) [data-lang-panel="fr"][hidden],
    html[data-ui-lang="vi"]:has([data-lang-panel="vi"]) [data-lang-panel="vi"][hidden] {
        display: block;
    }

    /* Hero Action Pills (High-Visibility LinkedIn, GitHub, Books, RSS) */
    .home-connect-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        margin: 0 0 1.35rem;
    }

    .connect-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.42rem;
        padding: 0.42rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--theme);
        color: var(--primary);
        font-size: 0.83rem;
        font-weight: 600;
        text-decoration: none;
        box-shadow: none !important;
        transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .connect-pill:hover {
        border-color: var(--primary);
        transform: translateY(-1px);
    }

    .connect-pill-primary {
        border-color: var(--track-sd-border);
        color: var(--track-sd-color);
        background: var(--track-sd-bg);
    }

    .connect-pill-primary:hover {
        border-color: var(--track-sd-color);
    }

    /* Custom Vector SVG Icons */
    .track-svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
        vertical-align: -2px;
    }

    .track-svg-series {
        width: 13px;
        height: 13px;
    }

    /* Home Architectural Atlas (Stripe-Press Minimalist Cards) */
    .home-atlas-wrapper {
        margin-bottom: 1.75rem !important;
        padding: 1.75rem 1.85rem !important;
        border: 1px solid var(--border);
        background: var(--entry);
    }

    .home-eyebrow {
        margin: 0 0 0.45rem !important;
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--secondary);
    }

    .home-hero-head h1 {
        font-size: clamp(1.75rem, 1.35rem + 1.2vw, 2.2rem) !important;
        line-height: 1.15;
    }

    .home-hero-lede {
        margin: 0.5rem 0 1rem !important;
        font-size: 0.98rem;
    }

    .home-atlas-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
        margin: 0;
    }

    .atlas-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 1.1rem 1.15rem;
        border: 1px solid var(--border);
        border-top-width: 3px;
        border-radius: 8px;
        background: var(--theme);
    }

    .atlas-sd { border-top-color: var(--track-sd-color); }
    .atlas-arch { border-top-color: var(--track-arch-color); }
    .atlas-sov { border-top-color: var(--track-sov-color); }

    .atlas-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-bottom: 0.55rem;
    }

    .atlas-title-wrap {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0 !important;
        font-size: 1.12rem;
        line-height: 1.25;
    }

    .atlas-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        flex-shrink: 0;
    }

    .atlas-icon-sd { color: var(--track-sd-color); background: var(--track-sd-bg); }
    .atlas-icon-arch { color: var(--track-arch-color); background: var(--track-arch-bg); }
    .atlas-icon-sov { color: var(--track-sov-color); background: var(--track-sov-bg); }

    .about-grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin: 1.25rem 0 2rem;
    }

    .about-grid-2 article {
        padding: 1.2rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--entry);
    }

    .about-grid-2 h2 {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 0.55rem !important;
        font-size: 1.05rem;
    }

    .about-grid-2 p {
        margin: 0;
        color: var(--secondary);
        font-size: 0.95rem;
        line-height: 1.65;
    }

    .track-icon {
        font-size: 1rem;
        line-height: 1;
        flex-shrink: 0;
    }

    .atlas-count {
        flex-shrink: 0;
        padding: 0.16rem 0.55rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--entry);
        font-size: 0.74rem;
        font-weight: 600;
        color: var(--primary);
        text-decoration: none;
        box-shadow: none !important;
        transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .atlas-count:hover {
        border-color: var(--primary);
        transform: translateX(1px);
    }

    .atlas-card h2 a {
        color: var(--primary);
        box-shadow: none;
    }

    .atlas-card h2 a:hover {
        text-decoration: underline;
    }

    .atlas-desc {
        margin: 0 0 0.75rem !important;
        font-size: 0.84rem;
        line-height: 1.45;
        color: var(--secondary);
    }

    .atlas-series-list {
        list-style: none;
        padding: 0;
        margin: 0 0 0.85rem;
        font-size: 0.82rem;
    }

    .atlas-series-list li {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
        padding: 0.28rem 0;
        border-top: 1px dashed var(--border);
    }

    .atlas-series-list li > a,
    .atlas-series-list li.atlas-upcoming > span:first-child {
        flex: 1 1 auto;
        min-width: 0;
        line-height: 1.35;
    }

    .atlas-series-list li a {
        color: var(--primary);
        box-shadow: none;
        font-weight: 500;
    }

    .atlas-series-list li a:hover {
        text-decoration: underline;
    }

    .atlas-series-list li > a + span,
    .atlas-series-list li > em {
        flex-shrink: 0;
        white-space: nowrap;
        font-size: 0.74rem;
        color: var(--secondary);
        font-style: normal;
    }

    .atlas-series-list li.atlas-upcoming > span:first-child {
        color: var(--secondary);
        font-weight: 500;
    }

    /* Option B: Full-Width Dual Showcase Grid (Sovera Engine + Books Shelf) */
    .home-showcase-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 1rem;
    }

<script>
document.addEventListener("DOMContentLoaded", function () {
    // 1. Interactive Track Filter
    const buttons = document.querySelectorAll(".home-filter-bar .filter-btn");
    const entries = document.querySelectorAll(".post-entry[data-track]");
    const emptyState = document.getElementById("filter-empty-state");

    if (buttons.length && entries.length) {
        function applyFilter(track) {
            let visibleCount = 0;
            entries.forEach(function (entry) {
                const matches = track === "all" || entry.getAttribute("data-track") === track;
                entry.style.display = matches ? "" : "none";
                if (matches) visibleCount++;
            });
            buttons.forEach(function (btn) {
                btn.classList.toggle("active", btn.getAttribute("data-filter") === track);
            });
            if (emptyState) {
                emptyState.hidden = visibleCount > 0;
            }
        }

        buttons.forEach(function (btn) {
            btn.addEventListener("click", function () {
                const track = btn.getAttribute("data-filter");
                applyFilter(track);
                const url = new URL(window.location);
                if (track === "all") {
                    url.searchParams.delete("track");
                } else {
                    url.searchParams.set("track", track);
                }
                window.history.replaceState({}, "", url);
            });
        });

        const initialTrack = new URLSearchParams(window.location.search).get("track");
        if (initialTrack && ["all", "sd", "arch", "sov"].includes(initialTrack)) {
            applyFilter(initialTrack);
        }
    }

    // 2. Trilingual EN / FR / VI Switcher (Top Header Pill)
    const langButtons = document.querySelectorAll(".lang-switch-pill .lang-btn");
    const langPanels = document.querySelectorAll("[data-lang-panel]");
    const i18nNodes = document.querySelectorAll("[data-i18n-en]");
    const supportedLangs = ["en", "fr", "vi"];

    function hasLanguageOnPage(lang) {
        if (lang === "en") return true;
        if (langPanels.length > 0) {
            return Array.from(langPanels).some(function (p) {
                return p.getAttribute("data-lang-panel") === lang;
            });
        }
        return Array.from(i18nNodes).some(function (n) {
            return Boolean(n.getAttribute("data-i18n-" + lang));
        });
    }

    function applyLanguage(lang, persistChoice) {
        const requested = supportedLangs.includes(lang) ? lang : "en";
        const effective = hasLanguageOnPage(requested) ? requested : "en";

        langButtons.forEach(function (btn) {
            const isSelected = btn.getAttribute("data-lang-switch") === effective;
            btn.classList.toggle("active", isSelected);
            btn.setAttribute("aria-pressed", isSelected ? "true" : "false");
        });

        langPanels.forEach(function (panel) {
            const match = panel.getAttribute("data-lang-panel") === effective;
            panel.hidden = !match;
        });

        i18nNodes.forEach(function (node) {
            const val = node.getAttribute("data-i18n-" + effective) || node.getAttribute("data-i18n-en");
            if (val) node.textContent = val;
        });

        document.documentElement.setAttribute("data-ui-lang", effective);
        if (persistChoice !== false) {
            try {
                sessionStorage.setItem("tp_session_lang", requested);
            } catch (e) {}
        }
    }

    langButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
            applyLanguage(btn.getAttribute("data-lang-switch"), true);
        });
    });

    if (langButtons.length > 0 || langPanels.length > 0 || i18nNodes.length > 0) {
        const urlLang = new URLSearchParams(window.location.search).get("lang");
        let savedLang = "en";
        try {
            savedLang = urlLang || sessionStorage.getItem("tp_session_lang") || "en";
        } catch (e) {
            savedLang = urlLang || "en";
        }
        applyLanguage(savedLang, Boolean(urlLang));
    }
});
</script>
